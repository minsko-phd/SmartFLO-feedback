name: VOC / 개선 요청
description: 버그 신고, 기능 개선·추가, 사용성·성능 이슈 등을 접수합니다.
title: "[VOC] "
labels:
  - voc
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **⚠️ 사내 정보 작성 금지**
        > 고객사명·사업명·보안 관련 정보는 적지 마세요.
        > 부득이한 경우 'H사', 'A프로젝트' 등 **가명 처리** 후 작성해 주세요.
        > 이 채널은 **공개(Public) 저장소**입니다.

  - type: dropdown
    id: type
    attributes:
      label: 유형
      description: 이슈 유형을 선택해 주세요.
      options:
        - 오류 · 버그
        - 불편사항
        - 개선 요청
        - 새 기능 요청
        - 기타
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 체감 우선순위
      description: 업무에 미치는 영향도를 기준으로 선택해 주세요.
      options:
        - 높음 (업무 지장)
        - 보통 (우회 가능)
        - 낮음
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 발생 화면
      description: 이슈가 발생한 화면을 선택해 주세요.
      options:
        - 분석 탭
        - AI 분석 탭
        - LOB 분석 탭
        - AI 리포트 탭
        - 설정 탭
        - 기타
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 상세 설명
      description: 어떤 상황에서, 어떤 문제가 발생했는지 구체적으로 적어주세요.
      placeholder: |
        예) 영상 파일 로드 시 검은 화면이 표시됩니다.
        - 파일: .mp4, 약 500MB
        - 다른 영상(소용량)은 정상 로드됨
        - 재현 빈도: 항상 발생
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 어떻게 동작해야 한다고 생각하시나요? (선택)
      placeholder: 영상이 정상적으로 로드되어 분석 화면이 표시되어야 합니다.
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 순서
      description: 오류가 발생한 경우, 재현하는 순서를 적어주세요. (선택)
      placeholder: |
        1. 영상 파일 로드
        2. 분석 시작 클릭
        3. 검은 화면 표시됨
    validations:
      required: false

  - type: input
    id: author
    attributes:
      label: 작성자
      description: 이름 또는 소속을 적어주세요. (선택)
      placeholder: 홍길동 / 제조1팀
    validations:
      required: false
