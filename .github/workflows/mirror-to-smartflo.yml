name: SmartFLO 이슈 미러링

on:
  issues:
    types: [opened]

jobs:
  mirror:
    if: "!contains(github.event.issue.labels.*.name, 'mirrored')"
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: 필수 라벨 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "mirrored" --color "bfd4f2" --description "SmartFLO로 미러링 완료" --repo ${{ github.repository }} 2>/dev/null || true
          gh label create "resolved" --color "0e8a16" --description "처리 완료" --repo ${{ github.repository }} 2>/dev/null || true

      - name: SmartFLO에 이슈 생성 및 미러링 처리
        uses: actions/github-script@v7
        env:
          SMARTFLO_PAT: ${{ secrets.SMARTFLO_PAT || secrets.PRIVATE_REPO_PAT }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pat = process.env.SMARTFLO_PAT;
            if (!pat) { core.warning('SMARTFLO_PAT 미설정'); return; }

            const issue = context.payload.issue;
            const body = [
              issue.body || '',
              '',
              '---',
              `> 🔗 원본: ${issue.html_url}`,
              `> 👤 작성자: ${issue.user.login}`,
            ].join('\n');

            const typeMatch = issue.body?.match(/### 유형\s*\n([^\n]+)/);
            const isBug = typeMatch?.[1]?.includes('오류') || typeMatch?.[1]?.includes('버그');
            const extraLabel = isBug ? 'bug' : 'enhancement';

            const res = await fetch('https://api.github.com/repos/minsko-phd/SmartFLO/issues', {
              method: 'POST',
              headers: {
                Authorization: `token ${pat}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                title: issue.title,
                body,
                labels: ['voc', 'needs-triage', extraLabel],
              }),
            });

            if (!res.ok) {
              const err = await res.text();
              core.setFailed(`SmartFLO 이슈 생성 실패 (${res.status}): ${err}`);
              return;
            }

            const created = await res.json();
            core.info(`SmartFLO 이슈 생성: #${created.number}`);

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['mirrored'],
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `✅ 개발팀에 전달되었습니다. (처리 번호: minsko-phd/SmartFLO#${created.number})\n\n진행 상황은 이 페이지에서 자동으로 업데이트됩니다.`,
            });
