name: 처리 완료 사용자 알림

on:
  issues:
    types: [labeled]

jobs:
  notify:
    if: github.event.label.name == 'resolved'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: 처리 완료 댓글 + 이슈 닫기
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const num = context.payload.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: num,
              body: '🎉 처리가 완료되었습니다!\n\n다음 업데이트에 반영됩니다. 앱을 재시작하면 자동 업데이트 알림이 표시됩니다.\n\n감사합니다 🙏',
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: num,
              state: 'closed',
            });
